name: Publish Packages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: npm run build

      - name: Configure npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Ensure npm version is unpublished
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if npm view "bazi-persona-skill@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "package.json version $PACKAGE_VERSION is already published to npm."
            echo "Please bump package.json before pushing to main."
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Prepare GitHub Packages tarball
        env:
          GITHUB_SCOPE: ${{ github.repository_owner }}
        run: |
          set -eu
          SCOPE=$(printf '%s' "$GITHUB_SCOPE" | tr '[:upper:]' '[:lower:]')
          PACK_DIR=$(mktemp -d)
          TARBALL=$(npm pack --pack-destination "$PACK_DIR")
          tar -xzf "$PACK_DIR/$TARBALL" -C "$PACK_DIR"
          PACKAGE_DIR="$PACK_DIR/package"
          node -e "const fs=require('fs'); const path='$PACKAGE_DIR/package.json'; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.name='@${SCOPE}/bazi-persona-skill'; pkg.publishConfig={...(pkg.publishConfig||{}), registry:'https://npm.pkg.github.com'}; fs.writeFileSync(path, JSON.stringify(pkg, null, 2)+'\n');"
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> "$GITHUB_ENV"

      - name: Configure GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@${{ github.repository_owner }}"

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish "$PACKAGE_DIR" --registry=https://npm.pkg.github.com
